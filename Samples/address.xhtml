<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:xf="http://www.w3.org/2002/xforms">
  <head>
    <title>Address</title>
    <xf:model>
      <xf:instance>
        <data xmlns="">
          <name>Ada Lovelace</name>
          <street>12 St James's Square</street>
          <city>London</city>
          <code>SW1Y 4LB</code>
        </data>
      </xf:instance>
    </xf:model>
  </head>
  <body>
    <xf:group>
      <xf:label>Mailing address</xf:label>
      <xf:input ref="name"><xf:label>Name</xf:label></xf:input>
      <xf:input ref="street"><xf:label>Street</xf:label></xf:input>
      <xf:input ref="city"><xf:label>City</xf:label></xf:input>
      <xf:input ref="code"><xf:label>Postal code</xf:label></xf:input>
      <xf:output value="concat(name, ', ', street, ', ', city, ' ', code)">
        <xf:label>Preview</xf:label>
      </xf:output>
    </xf:group>
  </body>
</html>
