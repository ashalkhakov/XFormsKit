<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:xf="http://www.w3.org/2002/xforms">
  <head>
    <title>Relevant MIP</title>
    <xf:model>
      <xf:instance>
        <data xmlns="">
          <enabled>enabled</enabled>
          <name>sample</name>
        </data>
      </xf:instance>
      <xf:bind nodeset="name" relevant="../enabled = 'enabled'"/>
    </xf:model>
  </head>
  <body>
    <xf:group>
      <xf:label>Relevance</xf:label>
      <xf:select1 ref="enabled">
        <xf:label>Control relevant</xf:label>
        <xf:item>
          <xf:label>Relevant</xf:label>
          <xf:value>enabled</xf:value>
        </xf:item>
        <xf:item>
          <xf:label>Not relevant</xf:label>
          <xf:value>disabled</xf:value>
        </xf:item>
      </xf:select1>
      <xf:input ref="name">
        <xf:label>Sample input</xf:label>
      </xf:input>
      <xf:output ref="name">
        <xf:label>Name</xf:label>
      </xf:output>
    </xf:group>
  </body>
</html>
