name: Release

# Tag a version to publish, or run it by hand: with a tag, it builds that
# tag and attaches to its release; with none, it builds the branch, as
# artifacts only. A tag with a - in it (v0.2.0-rc1) makes a pre-release.
#
# Signing, notarizing, the Sparkle appcasts, the GNUstep stack, linuxdeploy
# and the AppImage's update information are gnustep-release-actions', the
# same in every app's release; the build, the packaging and the smoke tests
# are this repository's own.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'A v* tag to build and attach to its release (empty: this branch, artifacts only)'
        required: false
        default: ''

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  ############################ Linux AppImage ############################
  appimage:
    name: Linux AppImage
    # Built on the oldest Ubuntu LTS still in support, not ubuntu-latest:
    # an AppImage carries its own libraries but not glibc, so it runs only
    # on a system at least as new as the one it was linked on. Built on a
    # current runner it fails to start on that LTS, which is what
    # appimage.github.io tests with (FreeCoreData's PR 9036 there). Raise
    # this only when that release leaves support.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    # The stack's settings (PREFIX, COMPONENTS, the toolchain) are
    # gnustep-release-actions/gnustep-stack's.
    env:
      # The commit of the shared gnustep-patches repository the stack is
      # built with: ci.yml's, so a release is built from what CI tested.
      GNUSTEP_PATCHES_REF: dcbad8f6db6db7054bc9152aad3e8686a233809d
    defaults:
      run:
        working-directory: ${{ github.workspace }}/source

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
          path: source

      - uses: actions/checkout@v4
        with:
          repository: ashalkhakov/gnustep-patches
          ref: ${{ env.GNUSTEP_PATCHES_REF }}
          path: gnustep-patches

      - name: Version
        run: |
          if [ -n "$TAG" ]; then
            echo "APP_VERSION=$TAG" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-build${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      # The patched stack, cached by its recipe. Beyond the default: the SVG
      # renderer draws through Opal (and Opal through libs-corebase), as
      # .github/scripts/dependencies.sh builds them for CI. No tools-xctest:
      # nothing in the image runs tests.
      - name: GNUstep
        uses: ashalkhakov/gnustep-release-actions/gnustep-stack@v1
        with:
          patches: ${{ github.workspace }}/gnustep-patches
          components: libobjc2 libdispatch tools-make libs-base libs-gui libs-back libs-corebase libs-opal eau

      - name: linuxdeploy and the AppImage runtime
        uses: ashalkhakov/gnustep-release-actions/appimage-tools@v1

      - name: Stamp the version
        run: ./Scripts/stamp-version.sh "$APP_VERSION"

      - name: Assemble AppDir
        run: GNUSTEP_PREFIX="$PREFIX" ./Scripts/prepare-appdir.sh

      # A release's image updates itself from the newest release (through
      # AppImageUpdate, Gear Lever and the like), by the .zsync attached
      # beside it; a pre-release's does not.
      - name: Update information
        uses: ashalkhakov/gnustep-release-actions/appimage-update-info@v1
        with:
          tag: ${{ env.TAG }}
          zsync: XFormsKit-*x86_64.AppImage.zsync

      - name: Package the AppImage
        run: GNUSTEP_PREFIX="$PREFIX" ./Scripts/package-appimage.sh

      # Proof it starts. Both apps are GUI-only, so they are launched against a
      # virtual display and asked to open a sample; a bundle that cannot find
      # its framework, its backend or its resources dies here rather than for
      # whoever downloads it.
      - name: Smoke-test the AppImage
        run: |
          sudo apt-get -q -y install xvfb
          image=$(ls XFormsKit-*.AppImage)
          chmod +x "$image"
          # "" is the no-argument case: the launcher, which is what
          # opening the image does.
          for app in "" viewer designer; do
            timeout 90 xvfb-run -a ./"$image" $app &
            pid=$!
            sleep 25
            if kill -0 $pid 2>/dev/null; then
              echo "${app:-launcher}: up after 25s"
              kill $pid 2>/dev/null || true
              wait $pid 2>/dev/null || true
            else
              wait $pid; status=$?
              echo "::error::${app:-launcher} exited on its own with status $status"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: XFormsKit-${{ env.APP_VERSION }}
          path: |
            ${{ github.workspace }}/source/XFormsKit-*.AppImage
            ${{ github.workspace }}/source/XFormsKit-*.AppImage.zsync
          if-no-files-found: error

      - name: Attach to the release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            ${{ github.workspace }}/source/XFormsKit-*.AppImage
            ${{ github.workspace }}/source/XFormsKit-*.AppImage.zsync

  ############################ macOS ############################
  macos:
    name: macOS (signed)
    runs-on: macos-15
    timeout-minutes: 60
    # The signing and notarisation secrets live in this environment, and an
    # environment's secrets are only readable by a job that names it: without
    # this line every one of them resolves to the empty string and the job
    # ships an unsigned build, saying so and passing.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - name: Version
        run: |
          if [ -n "$TAG" ]; then
            echo "APP_VERSION=$TAG" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-build${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Stamp the version
        run: ./Scripts/stamp-version.sh "$APP_VERSION"

      # Each app embeds its frameworks: XFormsKit, the designer
      # XFormsDesignKit as well, and both Sparkle.
      - name: Build
        run: |
          for scheme in XFormsKit XFormsViewer XFormsDesigner; do
            xcodebuild -project XFormsKit.xcodeproj -scheme "$scheme" \
              -destination 'platform=macOS' -configuration Release build
          done
          built=$(xcodebuild -project XFormsKit.xcodeproj -scheme XFormsViewer \
                    -destination 'platform=macOS' -configuration Release \
                    -showBuildSettings 2>/dev/null \
                  | awk -F' = ' '/ BUILT_PRODUCTS_DIR/{print $2; exit}')
          echo "BUILT=$built" >> "$GITHUB_ENV"
          for app in XFormsViewer XFormsDesigner; do
            test -d "$built/$app.app/Contents/Frameworks/Sparkle.framework" \
              || { echo "::error::$app.app does not embed Sparkle.framework"; exit 1; }
          done

      # Signing, notarizing and the appcasts are gnustep-release-actions'.
      # Each step skips itself, saying so, when its secrets are absent (a
      # fork, a dry run): the build is then unsigned, and named so. Both
      # apps are signed with the one identity the first chose.
      - name: Sign the viewer
        id: sign
        uses: ashalkhakov/gnustep-release-actions/macos-sign@v1
        with:
          app: ${{ env.BUILT }}/XFormsViewer.app
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.MACOS_SIGN_IDENTITY }}

      - name: Sign the designer
        if: steps.sign.outputs.signed == 'true'
        uses: ashalkhakov/gnustep-release-actions/macos-sign@v1
        with:
          app: ${{ env.BUILT }}/XFormsDesigner.app
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.MACOS_SIGN_IDENTITY }}

      - name: Notarize the viewer
        if: steps.sign.outputs.signed == 'true'
        uses: ashalkhakov/gnustep-release-actions/macos-notarize@v1
        with:
          app: ${{ env.BUILT }}/XFormsViewer.app
          apple-id: ${{ secrets.NOTARY_APPLE_ID }}
          team-id: ${{ secrets.NOTARY_TEAM_ID }}
          password: ${{ secrets.NOTARY_PASSWORD }}

      - name: Notarize the designer
        if: steps.sign.outputs.signed == 'true'
        uses: ashalkhakov/gnustep-release-actions/macos-notarize@v1
        with:
          app: ${{ env.BUILT }}/XFormsDesigner.app
          apple-id: ${{ secrets.NOTARY_APPLE_ID }}
          team-id: ${{ secrets.NOTARY_TEAM_ID }}
          password: ${{ secrets.NOTARY_PASSWORD }}

      - name: Package
        run: |
          suffix=""
          [ "${{ steps.sign.outputs.signed }}" = "true" ] || suffix="-unsigned"
          for app in XFormsViewer XFormsDesigner; do
            ditto -c -k --keepParent "$BUILT/$app.app" \
              "$app-macOS-${APP_VERSION}${suffix}.zip"
          done

      # One appcast per app, which its Sparkle reads (SUFeedURL in
      # Apps/<App>/<App>-Info.plist: the newest release's
      # appcast-<App>.xml), signed with the key whose public half is
      # SUPublicEDKey; for a release only.
      - name: Appcast for the viewer
        if: steps.sign.outputs.signed == 'true'
        uses: ashalkhakov/gnustep-release-actions/sparkle-appcast@v1
        with:
          archive: ${{ github.workspace }}/XFormsViewer-macOS-${{ env.APP_VERSION }}.zip
          output: ${{ github.workspace }}/appcast-XFormsViewer.xml
          tag: ${{ env.TAG }}
          private-key: ${{ secrets.SPARKLE_PRIVATE_KEY }}

      - name: Appcast for the designer
        if: steps.sign.outputs.signed == 'true'
        uses: ashalkhakov/gnustep-release-actions/sparkle-appcast@v1
        with:
          archive: ${{ github.workspace }}/XFormsDesigner-macOS-${{ env.APP_VERSION }}.zip
          output: ${{ github.workspace }}/appcast-XFormsDesigner.xml
          tag: ${{ env.TAG }}
          private-key: ${{ secrets.SPARKLE_PRIVATE_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: XFormsKit-macOS-${{ env.APP_VERSION }}
          path: |
            ${{ github.workspace }}/XFormsViewer-macOS-*.zip
            ${{ github.workspace }}/XFormsDesigner-macOS-*.zip
            ${{ github.workspace }}/appcast-*.xml

      - name: Attach to the release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            ${{ github.workspace }}/XFormsViewer-macOS-*.zip
            ${{ github.workspace }}/XFormsDesigner-macOS-*.zip
            ${{ github.workspace }}/appcast-*.xml
