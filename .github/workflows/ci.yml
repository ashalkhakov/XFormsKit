name: CI

# pull_request fires for a PR against any branch, and uses the workflow file
# from the PR's own head -- so a branch can run CI through a PR before this
# file has ever existed on master.
#
# workflow_dispatch is the opposite: GitHub only offers the "Run workflow"
# button for workflows present on the repository's DEFAULT branch. Until this
# lands on master there is no button, however the file is written.
on:
  push:
  pull_request:
  workflow_dispatch:

# A run that lands while an earlier one is still going supersedes it; there is
# no value in finishing CI for a commit nobody will look at again.
#
# The key is the branch NAME rather than the ref, so that a push and the pull
# request for the same branch share one group: pushing to a branch with an
# open PR would otherwise start two nearly identical runs, and on a private
# repository the macOS half of each bills at 10x. github.head_ref is set only
# for pull_request events, where it is the source branch; github.ref_name is
# the branch for a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ########################### macOS / Cocoa ###########################
  # Every suite runs twice, once against each XML back end. XFXMLTypes.h binds
  # the engine's XFXML* names to NSXML by default and to the portable XFDOM
  # under XF_PORTABLE_DOM, and only running both keeps the two honest: a
  # divergence in XFDOM shows up here as an engine test failure, not months
  # later on iOS.
  #
  # macOS minutes bill at 10x on a private repository. Adding
  #   if: github.event_name != 'push' || github.ref == 'refs/heads/master'
  # confines this job to pull requests and the default branch.
  macos:
    name: macOS (${{ matrix.name }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: NSXML
            defs: ""
            portable: false
          - name: XFDOM
            defs: "XF_PORTABLE_DOM=1"
            portable: true
    env:
      XF_DEFS: ${{ matrix.defs }}
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      # Built first and on its own, so a compile error in the framework is
      # reported as that rather than as a test failure.
      - name: Build XFormsKit
        run: |
          xcodebuild -project XFormsKit.xcodeproj -scheme XFormsKit \
            -destination 'platform=macOS' -configuration Debug build \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) '"$XF_DEFS"

      # The apps still name NSXML types directly, so they only build in the
      # default configuration. When they are migrated to XFXML*, drop the
      # condition and let them build in both.
      - name: Build the viewer and the designer
        if: ${{ !matrix.portable }}
        run: |
          for scheme in XFormsViewer XFormsDesigner; do
            xcodebuild -project XFormsKit.xcodeproj -scheme "$scheme" \
              -destination 'platform=macOS' -configuration Debug build
          done

      # The always-green gate.
      - name: Unit tests
        run: |
          xcodebuild -project XFormsKit.xcodeproj -scheme XFormsKit \
            -destination 'platform=macOS' -configuration Debug \
            -resultBundlePath "$RUNNER_TEMP/XFormsKitTests-${{ matrix.name }}.xcresult" test \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) '"$XF_DEFS"

      # The W3C XForms 1.1 suite. docs/w3c-xctests.md calls it a conformance
      # report rather than a regression gate, but it has been fully green
      # since the port, so it is run as a gate here: a red case is either a
      # real regression or a deliberate change that should move the doc.
      - name: W3C conformance suite
        run: |
          xcodebuild -project XFormsKit.xcodeproj -scheme XFW3CTests \
            -destination 'platform=macOS' -configuration Debug \
            -resultBundlePath "$RUNNER_TEMP/XFW3CTests-${{ matrix.name }}.xcresult" test \
            GCC_PREPROCESSOR_DEFINITIONS='$(inherited) '"$XF_DEFS"

      # The reason the portable DOM exists. The framework target is
      # multiplatform: on an iPhone SDK it excludes Sources/XFormsKit/AppKit
      # and defines XF_PORTABLE_DOM, so what builds here is the engine, the
      # XPath layer and XFDOM against Foundation alone. iOS Foundation has
      # NSXMLParser and no DOM, so anything that reaches for NSXMLDocument
      # fails here and nowhere else.
      #
      # Both SDKs: the simulator is what a test host would use, and the
      # device slice is the one with the real linker constraints.
      - name: Build the framework for iOS
        if: ${{ matrix.portable }}
        run: |
          xcodebuild -project XFormsKit.xcodeproj -target XFormsKit \
            -sdk iphonesimulator -configuration Debug build
          xcodebuild -project XFormsKit.xcodeproj -target XFormsKit \
            -sdk iphoneos -configuration Debug build CODE_SIGNING_ALLOWED=NO

      # Building proves the engine compiles for iOS; this proves it WORKS
      # there. Both test bundles are multiplatform: on an iPhone SDK they
      # drop the AppKit widget tests and the NSXML differential tests, and
      # what is left -- the engine and the whole W3C conformance suite --
      # runs against XFDOM in the simulator.
      - name: Test on the iOS Simulator
        if: ${{ matrix.portable }}
        run: |
          # Whatever iPhone this runner's Xcode ships with, by UDID: naming a
          # model pins the job to an Xcode version, and the name changes
          # every autumn.
          udid=$(xcrun simctl list devices available \
                 | grep -E '^ +iPhone' | head -1 \
                 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -z "$udid" ]; then
            echo "::error::no iOS Simulator device is available on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "simulator: $udid"
          for scheme in XFormsKit XFW3CTests; do
            xcodebuild -project XFormsKit.xcodeproj -scheme "$scheme" \
              -destination "platform=iOS Simulator,id=$udid" \
              -configuration Debug \
              -resultBundlePath "$RUNNER_TEMP/$scheme-iOS.xcresult" test
          done

      # A framework that builds but quietly drags in the view layer, or links
      # something not on iOS, would defeat the point -- so assert the shape of
      # what came out rather than trusting the build to have excluded it.
      - name: The iOS framework carries no view layer
        if: ${{ matrix.portable }}
        run: |
          products=$(xcodebuild -project XFormsKit.xcodeproj -target XFormsKit \
                       -sdk iphonesimulator -configuration Debug -showBuildSettings 2>/dev/null \
                     | awk -F' = ' '/ BUILT_PRODUCTS_DIR/{print $2; exit}')
          binary="$products/XFormsKit.framework/XFormsKit"
          echo "== linked libraries =="
          otool -L "$binary" | tail -n +2
          # CoreGraphics and CoreText are expected: the SVG renderer draws
          # through them, and GNUstep gets both from Opal. A UI framework is
          # not — the view layer must stay out of this build.
          for framework in AppKit UIKit; do
            if otool -L "$binary" | grep -q "/$framework.framework/"; then
              echo "::error::the iOS framework links $framework; it must carry no view layer"
              exit 1
            fi
          done
          classes=$(nm -arch arm64 -gU "$binary" | sed -n 's/.*_OBJC_CLASS_\$_//p')
          for c in XFProcessor XFDOMDocument XFXPath XFSubmission XFSVGDocument XFRichText; do
            echo "$classes" | grep -qx "$c" \
              || { echo "::error::$c is missing from the iOS framework"; exit 1; }
          done
          for c in XFFormView XFSVGView XFRichTextEditor XFTableAdapter XFBadgeView; do
            echo "$classes" | grep -qx "$c" \
              && { echo "::error::the view layer leaked into the iOS framework ($c)"; exit 1; }
          done
          echo "engine, SVG renderer and rich-text converter present, view layer excluded"

      # XFDOMTests is a differential suite: it asserts XFDOM and NSXML agree.
      # A rename that quietly points both sides at the same implementation
      # would leave it green while testing nothing, so check it still names
      # the one it is comparing against.
      - name: The DOM tests still compare against NSXML
        run: |
          grep -q "NSXMLDocument" Tests/XFormsKitTests/XFDOMTests.m \
            || { echo "::error::XFDOMTests no longer references NSXML; it is no longer differential"; exit 1; }

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-${{ matrix.name }}-test-results
          path: ${{ runner.temp }}/*.xcresult
          retention-days: 7

  ########################### GNUstep / Linux ###########################
  # The platform that is otherwise only verified by hand. Both XML back ends
  # are exercised in one job rather than as a matrix, because the GNUstep
  # stack is built from source and two jobs would race to fill the same cache
  # on a cold start.
  gnustep:
    name: Ubuntu (GNUstep, clang, gnustep-2.0)
    runs-on: ubuntu-latest
    # The dependency build is the long pole; everything after it is minutes.
    timeout-minutes: 90
    env:
      SRC_PATH: ${{ github.workspace }}/source
      DEPS_PATH: ${{ github.workspace }}/dependencies
      INSTALL_PATH: ${{ github.workspace }}/build
      CC: clang
      CXX: clang++
      LIBRARY_COMBO: ng-gnu-gnu
      RUNTIME_VERSION: gnustep-2.0
      # libobjc2 and libdispatch land in the prefix's plain lib/, which the
      # gnustep layout does not treat as a library root. GNUstep.sh prepends
      # the roots it does know about to this.
      LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib
    defaults:
      run:
        working-directory: ${{ github.workspace }}/source

    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      # Seconds, and before the half-hour dependency build. Importing a
      # framework GNUstep does not have compiles on a Mac and breaks this
      # job, which is a slow way to find out.
      #
      # What GNUstep DOES have: <AppKit/AppKit.h>, and -- since the project
      # adopted Opal -- <CoreGraphics/CoreGraphics.h> and
      # <CoreText/CoreText.h>, which the SVG renderer draws through. What it
      # does not: Cocoa.h, QuartzCore, UIKit.
      #
      # Matches import lines only. An earlier version grepped for the bare
      # framework name and failed on prose in a comment.
      #
      # Scoped to what this job actually builds: the framework, the tests and
      # the viewer. The designer is macOS-only and vendors third-party views
      # that do import Cocoa.h.
      - name: No imports GNUstep cannot satisfy
        run: |
          if grep -rnE '^[[:space:]]*#[[:space:]]*(import|include)[[:space:]]*[<"](Cocoa/|QuartzCore/|UIKit/)' \
               --include="*.h" --include="*.m" Sources Tests Apps/XFormsViewer; then
            echo "::error::an import GNUstep cannot satisfy; see the step's comment"
            exit 1
          fi
          echo "none found"

      - name: Install packages
        run: |
          ./.github/scripts/apt-update.sh
          sudo apt-get -q -y install \
            pkg-config libgnutls28-dev libffi-dev libicu-dev libxml2-dev libxslt1-dev \
            libssl-dev libavahi-client-dev zlib1g-dev gnutls-bin libcurl4-gnutls-dev \
            libgmp-dev libcairo2-dev libjpeg-dev libtiff-dev libpng-dev libicns-dev \
            libpthread-workqueue-dev \
            libfreetype-dev libfontconfig1-dev libxrender-dev liblcms2-dev \
            libxt-dev libxmu-dev libxft-dev libxrandr-dev libxfixes-dev libxcursor-dev \
            xvfb
          # freetype2, fontconfig, Xrender and lcms2 are Opal's: its
          # Source/GNUmakefile links all four (plus cairo, libpng, jpeg and
          # tiff, which are already here). Xft pulls the first three in
          # practice, but Opal names them, so name them too.
          #
          # The gnustep-2.0 runtime needs ld.gold or lld. ld.gold is gone from
          # binutils on newer Ubuntu, so fall back to lld rather than failing
          # on a missing alternative.
          if [ -x /usr/bin/ld.gold ]; then
            sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.gold 10
          else
            sudo apt-get -q -y install lld
            sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.lld 10
          fi
          ld --version | head -1

      # The whole GNUstep stack is built from source, which takes far longer
      # than XFormsKit does. It only changes when the pinned dependency script
      # changes, so it is cached against that. Restored and saved as two
      # separate steps rather than with the combined action, so the save
      # captures the stack before anything of ours is built against it.
      - name: Restore GNUstep
        id: gnustep-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.INSTALL_PATH }}
          key: gnustep-v1-${{ runner.os }}-${{ hashFiles('source/.github/scripts/dependencies.sh', 'source/patches/gnustep/*.patch') }}

      - name: Build GNUstep
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        run: ./.github/scripts/dependencies.sh

      - name: Save GNUstep
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.INSTALL_PATH }}
          key: gnustep-v1-${{ runner.os }}-${{ hashFiles('source/.github/scripts/dependencies.sh', 'source/patches/gnustep/*.patch') }}

      # ---- default configuration: the engine on gnustep-base's NSXML ----

      - name: Build XFormsKit (NSXML)
        run: |
          . $INSTALL_PATH/System/Library/Makefiles/GNUstep.sh
          make

      - name: Unit tests (NSXML)
        run: |
          . $INSTALL_PATH/System/Library/Makefiles/GNUstep.sh
          xvfb-run -a make check

      - name: W3C conformance suite (NSXML)
        run: |
          . $INSTALL_PATH/System/Library/Makefiles/GNUstep.sh
          xvfb-run -a make w3ccheck

      - name: Build the viewer
        run: |
          . $INSTALL_PATH/System/Library/Makefiles/GNUstep.sh
          make viewer

      # ---- portable configuration: the same engine on XFDOM ----
      #
      # The flag changes how every source compiles, so the tree is cleaned
      # between the two passes rather than relinked.

      - name: Build XFormsKit (XFDOM)
        run: |
          . $INSTALL_PATH/System/Library/Makefiles/GNUstep.sh
          make clean
          make XF_PORTABLE_DOM=1

      - name: Unit tests (XFDOM)
        run: |
          . $INSTALL_PATH/System/Library/Makefiles/GNUstep.sh
          xvfb-run -a make check XF_PORTABLE_DOM=1

      - name: W3C conformance suite (XFDOM)
        run: |
          . $INSTALL_PATH/System/Library/Makefiles/GNUstep.sh
          xvfb-run -a make w3ccheck XF_PORTABLE_DOM=1
