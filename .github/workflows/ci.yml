name: CI

# pull_request fires for a PR against any branch, and uses the workflow file
# from the PR's own head -- so a branch can run CI through a PR before this
# file has ever existed on master.
#
# workflow_dispatch is the opposite: GitHub only offers the "Run workflow"
# button for workflows present on the repository's DEFAULT branch. Until this
# lands on master there is no button, however the file is written.
on:
  push:
  pull_request:
  workflow_dispatch:

# A run that lands while an earlier one is still going supersedes it; there is
# no value in finishing CI for a commit nobody will look at again.
#
# The key is the branch NAME rather than the ref, so that a push and the pull
# request for the same branch share one group: pushing to a branch with an
# open PR would otherwise start two nearly identical runs, and on a private
# repository the macOS half of each bills at 10x. github.head_ref is set only
# for pull_request events, where it is the source branch; github.ref_name is
# the branch for a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ########################### macOS / Cocoa ###########################
  # One XML back end: XFDOM, the portable tree, on every platform.
  #
  # This job used to run every suite twice, once against NSXML and once
  # against XFDOM, because the engine could be built either way. XFDOM has
  # since passed every suite on macOS, GNUstep and iOS, so the second tree
  # was retired -- one implementation means one set of behaviours to know,
  # and the apps no longer need a second configuration to be built in.
  #
  # XFDOMTests still compares against the platform's NSXML where there is
  # one, as a reference for what a mature DOM does; see the step below.
  #
  # macOS minutes bill at 10x on a private repository. Adding
  #   if: github.event_name != 'push' || github.ref == 'refs/heads/master'
  # confines this job to pull requests and the default branch.
  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      # Built first and on its own, so a compile error in the framework is
      # reported as that rather than as a test failure.
      - name: Build XFormsKit
        run: |
          xcodebuild -project XFormsKit.xcodeproj -scheme XFormsKit \
            -destination 'platform=macOS' -configuration Debug build

      # Both apps speak XFXML* now, like the engine, so they build in the
      # one configuration there is. They used to name NSXML types directly
      # and were pinned to the NSXML leg of a two-leg matrix.
      - name: Build the viewer and the designer
        run: |
          for scheme in XFormsViewer XFormsDesigner; do
            xcodebuild -project XFormsKit.xcodeproj -scheme "$scheme" \
              -destination 'platform=macOS' -configuration Debug build
          done

      # The always-green gate.
      - name: Unit tests
        run: |
          xcodebuild -project XFormsKit.xcodeproj -scheme XFormsKit \
            -destination 'platform=macOS' -configuration Debug \
            -resultBundlePath "$RUNNER_TEMP/XFormsKitTests.xcresult" test

      # The W3C XForms 1.1 suite. docs/w3c-xctests.md calls it a conformance
      # report rather than a regression gate, but it has been fully green
      # since the port, so it is run as a gate here: a red case is either a
      # real regression or a deliberate change that should move the doc.
      - name: W3C conformance suite
        run: |
          xcodebuild -project XFormsKit.xcodeproj -scheme XFW3CTests \
            -destination 'platform=macOS' -configuration Debug \
            -resultBundlePath "$RUNNER_TEMP/XFW3CTests.xcresult" test

      # The reason the portable DOM exists. The framework target is
      # multiplatform: on an iPhone SDK it excludes Sources/XFormsKit/AppKit,
      # so what builds here is the engine, the XPath layer and XFDOM against
      # Foundation alone. iOS Foundation has NSXMLParser and no DOM, so
      # anything that reaches for NSXMLDocument fails here and nowhere else
      # -- which is what made XFDOM necessary, and is now moot for the
      # engine itself since XFDOM is the only tree.
      #
      # Both SDKs: the simulator is what a test host would use, and the
      # device slice is the one with the real linker constraints.
      - name: Build the framework for iOS
        run: |
          xcodebuild -project XFormsKit.xcodeproj -target XFormsKit \
            -sdk iphonesimulator -configuration Debug build
          xcodebuild -project XFormsKit.xcodeproj -target XFormsKit \
            -sdk iphoneos -configuration Debug build CODE_SIGNING_ALLOWED=NO

      # The iOS host app (Apps/XFormsMobile): a form picker and the UIKit
      # form. Simulator only -- a device build of an app needs a signing
      # identity this runner has no reason to hold, and the framework's
      # device slice above already covers the linker constraints.
      - name: Build the iOS app
        run: |
          xcodebuild -project XFormsKit.xcodeproj -target XFormsMobile \
            -sdk iphonesimulator -configuration Debug build

      # Building proves the engine compiles for iOS; this proves it WORKS
      # there. Both test bundles are multiplatform: on an iPhone SDK they
      # drop the AppKit widget tests and the NSXML differential tests, and
      # what is left -- the engine and the whole W3C conformance suite --
      # runs against XFDOM in the simulator.
      - name: Test on the iOS Simulator
        run: |
          # Whatever iPhone this runner's Xcode ships with, by UDID: naming a
          # model pins the job to an Xcode version, and the name changes
          # every autumn.
          udid=$(xcrun simctl list devices available \
                 | grep -E '^ +iPhone' | head -1 \
                 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -z "$udid" ]; then
            echo "::error::no iOS Simulator device is available on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "simulator: $udid"
          for scheme in XFormsKit XFW3CTests; do
            xcodebuild -project XFormsKit.xcodeproj -scheme "$scheme" \
              -destination "platform=iOS Simulator,id=$udid" \
              -configuration Debug \
              -resultBundlePath "$RUNNER_TEMP/$scheme-iOS.xcresult" test
          done

      # A framework that builds but quietly drags in the view layer, or links
      # something not on iOS, would defeat the point -- so assert the shape of
      # what came out rather than trusting the build to have excluded it.
      # The framework's SHAPE on iOS. It used to be asserted to carry no
      # view layer at all, which was true while the port had none; it now
      # ships the UIKit form layer, so the invariant has moved: UIKit is
      # expected, and AppKit is the one that must never appear.
      - name: The iOS framework is the engine plus the UIKit form layer
        run: |
          products=$(xcodebuild -project XFormsKit.xcodeproj -target XFormsKit \
                       -sdk iphonesimulator -configuration Debug -showBuildSettings 2>/dev/null \
                     | awk -F' = ' '/ BUILT_PRODUCTS_DIR/{print $2; exit}')
          binary="$products/XFormsKit.framework/XFormsKit"
          echo "== linked libraries =="
          otool -L "$binary" | tail -n +2
          # CoreGraphics and CoreText are expected: the SVG renderer draws
          # through them, and GNUstep gets both from Opal. AppKit does not
          # exist on iOS, so linking it means the macOS widget layer was
          # dragged in.
          if otool -L "$binary" | grep -q "/AppKit.framework/"; then
            echo "::error::the iOS framework links AppKit"
            exit 1
          fi
          otool -L "$binary" | grep -q "/UIKit.framework/" \
            || { echo "::error::the iOS framework does not link UIKit — the form layer is missing"; exit 1; }
          classes=$(nm -arch arm64 -gU "$binary" | sed -n 's/.*_OBJC_CLASS_\$_//p')
          for c in XFProcessor XFDOMDocument XFXPath XFSubmission XFSVGDocument XFRichText \
                   XFFormRows XFFormViewController; do
            echo "$classes" | grep -qx "$c" \
              || { echo "::error::$c is missing from the iOS framework"; exit 1; }
          done
          # The AppKit widget layer stays out: these are what
          # EXCLUDED_SOURCE_FILE_NAMES[sdk=iphone*] drops, and a rename that
          # quietly re-included one would otherwise go unnoticed.
          for c in XFFormView XFSVGView XFRichTextEditor XFTableAdapter XFBadgeView; do
            echo "$classes" | grep -qx "$c" \
              && { echo "::error::the AppKit view layer leaked into the iOS framework ($c)"; exit 1; }
          done
          echo "engine, SVG, rich text and the UIKit form layer present; AppKit layer excluded"

      # XFDOMTests is a differential suite: it asserts XFDOM and NSXML agree.
      # A rename that quietly points both sides at the same implementation
      # would leave it green while testing nothing, so check it still names
      # the one it is comparing against.
      # XFDOMTests is the one place NSXML is still used, deliberately: it
      # is the reference for what a mature DOM does, and asserting XFDOM
      # against it is how a divergence gets noticed. Now that the engine
      # has no NSXML configuration, this guard is the only thing keeping
      # that comparison from quietly disappearing.
      - name: The DOM tests still compare against NSXML
        run: |
          grep -q "NSXMLDocument" Tests/XFormsKitTests/XFDOMTests.m \
            || { echo "::error::XFDOMTests no longer references NSXML; it is no longer differential"; exit 1; }

      # The viewer's Samples menu is a hand-written list, and the GNUstep
      # build copies the same files in by name, so a sample added to
      # Samples/ is invisible in both until someone remembers two more
      # places. dialog.xhtml sat there unlisted from the day xf:dialog
      # landed. Apple's app bundles the folder itself and needs no list.
      - name: Every sample is offered by the viewer
        run: |
          missing=0
          for f in Samples/*.xhtml; do
            name=$(basename "$f")
            grep -q "\"$name\"" Apps/XFormsViewer/main.m \
              || { echo "::error file=Apps/XFormsViewer/main.m::$name is not in the Samples menu"; missing=1; }
            grep -q "Samples/$name" Apps/XFormsViewer/GNUmakefile \
              || { echo "::error file=Apps/XFormsViewer/GNUmakefile::$name is not copied into the GNUstep bundle"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "all listed"

      # An unsigned build of each app on every commit, so there is always
      # something to hand someone. release.yml makes the signed, notarized
      # ones; these are named for the commit and expire.
      - name: Package the apps
        run: |
          built=$(xcodebuild -project XFormsKit.xcodeproj -scheme XFormsViewer \
                    -destination 'platform=macOS' -configuration Debug \
                    -showBuildSettings 2>/dev/null \
                  | awk -F' = ' '/ BUILT_PRODUCTS_DIR/{print $2; exit}')
          for app in XFormsViewer XFormsDesigner; do
            # each app carries its own copy of the framework it links
            # through @rpath; without it the bundle does not start off this
            # machine, which is what an embed phase is for
            test -d "$built/$app.app/Contents/Frameworks/XFormsKit.framework" \
              || { echo "::error::$app.app does not embed XFormsKit.framework"; exit 1; }
            ditto -c -k --keepParent "$built/$app.app" "$app-macOS-unsigned.zip"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: XFormsKit-macOS-${{ github.sha }}
          path: |
            XFormsViewer-macOS-unsigned.zip
            XFormsDesigner-macOS-unsigned.zip
          retention-days: 14
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-test-results
          path: ${{ runner.temp }}/*.xcresult
          retention-days: 7

  ########################### GNUstep / Linux ###########################
  # The platform that is otherwise only verified by hand. Both XML back ends
  # are exercised in one job rather than as a matrix, because the GNUstep
  # stack is built from source and two jobs would race to fill the same cache
  # on a cold start.
  gnustep:
    name: Ubuntu (GNUstep, clang, gnustep-2.0)
    runs-on: ubuntu-latest
    # The dependency build is the long pole; everything after it is minutes.
    timeout-minutes: 90
    env:
      SRC_PATH: ${{ github.workspace }}/source
      DEPS_PATH: ${{ github.workspace }}/dependencies
      INSTALL_PATH: ${{ github.workspace }}/build
      CC: clang
      CXX: clang++
      LIBRARY_COMBO: ng-gnu-gnu
      RUNTIME_VERSION: gnustep-2.0
      # libobjc2 and libdispatch land in the prefix's plain lib/, which the
      # gnustep layout does not treat as a library root. GNUstep.sh prepends
      # the roots it does know about to this.
      LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib
    defaults:
      run:
        working-directory: ${{ github.workspace }}/source

    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      # Seconds, and before the half-hour dependency build. Importing a
      # framework GNUstep does not have compiles on a Mac and breaks this
      # job, which is a slow way to find out.
      #
      # What GNUstep DOES have: <AppKit/AppKit.h>, and -- since the project
      # adopted Opal -- <CoreGraphics/CoreGraphics.h> and
      # <CoreText/CoreText.h>, which the SVG renderer draws through. What it
      # does not: Cocoa.h, QuartzCore, UIKit -- see the next paragraph.
      #
      # UIKit and Cocoa are special cases. Their headers are READ on
      # GNUstep -- XFormsKit.h pulls in XFFormViewController.h, XFRichText.h
      # declares both presentations, and the designer vendors third-party
      # views written against Cocoa -- so those imports are allowed, but only
      # behind `#if __has_include(<Framework/Framework.h>)` with an AppKit or
      # Foundation branch beside them. A bare one compiles on a Mac and breaks
      # this job half an hour later, which is the mistake this step exists to
      # catch early.
      #
      # Matches import lines only. An earlier version grepped for the bare
      # framework name and failed on prose in a comment.
      #
      # Scoped to what this job builds: the framework, the tests, both apps
      # and the launcher that chooses between them inside the AppImage.
      # Apps/XFormsMobile is iOS-only and is never built here.
      - name: No imports GNUstep cannot satisfy
        run: |
          tree="Sources Tests Apps/XFormsViewer Apps/XFormsDesigner Apps/XFormsLauncher"
          unguarded=0
          for framework in Cocoa UIKit QuartzCore; do
            files=$(grep -rlE "^[[:space:]]*#[[:space:]]*(import|include)[[:space:]]*[<\"]${framework}/" \
                      --include="*.h" --include="*.m" $tree || true)
            for f in $files; do
              if ! grep -q "__has_include(<${framework}/${framework}.h>)" "$f"; then
                echo "::error file=$f::imports $framework without a __has_include guard"
                unguarded=1
              fi
            done
          done
          [ "$unguarded" -eq 0 ] || exit 1
          echo "every framework import GNUstep lacks is guarded"

      - name: Install packages
        run: |
          ./.github/scripts/apt-update.sh
          sudo apt-get -q -y install \
            pkg-config libgnutls28-dev libffi-dev libicu-dev libxml2-dev libxslt1-dev \
            libssl-dev libavahi-client-dev zlib1g-dev gnutls-bin libcurl4-gnutls-dev \
            libgmp-dev libcairo2-dev libjpeg-dev libtiff-dev libpng-dev libicns-dev \
            libpthread-workqueue-dev \
            libfreetype-dev libfontconfig1-dev libxrender-dev liblcms2-dev \
            libxt-dev libxmu-dev libxft-dev libxrandr-dev libxfixes-dev libxcursor-dev \
            xvfb
          # freetype2, fontconfig, Xrender and lcms2 are Opal's: its
          # Source/GNUmakefile links all four (plus cairo, libpng, jpeg and
          # tiff, which are already here). Xft pulls the first three in
          # practice, but Opal names them, so name them too.
          #
          # The gnustep-2.0 runtime needs ld.gold or lld. ld.gold is gone from
          # binutils on newer Ubuntu, so fall back to lld rather than failing
          # on a missing alternative.
          if [ -x /usr/bin/ld.gold ]; then
            sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.gold 10
          else
            sudo apt-get -q -y install lld
            sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.lld 10
          fi
          ld --version | head -1

      # The whole GNUstep stack is built from source, which takes far longer
      # than XFormsKit does. It only changes when the pinned dependency script
      # changes, so it is cached against that. Restored and saved as two
      # separate steps rather than with the combined action, so the save
      # captures the stack before anything of ours is built against it.
      - name: Restore GNUstep
        id: gnustep-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.INSTALL_PATH }}
          key: gnustep-v1-${{ runner.os }}-${{ hashFiles('source/.github/scripts/dependencies.sh', 'source/patches/gnustep/*.patch') }}

      - name: Build GNUstep
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        run: ./.github/scripts/dependencies.sh

      - name: Save GNUstep
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.INSTALL_PATH }}
          key: gnustep-v1-${{ runner.os }}-${{ hashFiles('source/.github/scripts/dependencies.sh', 'source/patches/gnustep/*.patch') }}

      # One pass: the engine on XFDOM, which is now the only tree. There
      # used to be a second pass against gnustep-base's NSXML, with a
      # `make clean` between them because the flag changed how every source
      # compiled.

      - name: Build XFormsKit
        run: |
          . $INSTALL_PATH/System/Library/Makefiles/GNUstep.sh
          make

      - name: Unit tests
        run: |
          . $INSTALL_PATH/System/Library/Makefiles/GNUstep.sh
          xvfb-run -a make check

      - name: W3C conformance suite
        run: |
          . $INSTALL_PATH/System/Library/Makefiles/GNUstep.sh
          xvfb-run -a make w3ccheck

      - name: Build the apps
        run: |
          . $INSTALL_PATH/System/Library/Makefiles/GNUstep.sh
          make apps

      # Packaged on every commit, unstable ones included, so there is always
      # a build to hand someone. Signed releases are release.yml's job; these
      # are named for the commit they came from and expire.
      - name: Fetch linuxdeploy and the AppImage runtime
        run: ./Scripts/install-linuxdeploy.sh

      - name: Package the AppImage
        env:
          LDAI_RUNTIME_FILE: /tmp/appimage-runtime/runtime-x86_64
          APP_VERSION: 0.0.0-${{ github.run_number }}-${{ github.sha }}
        run: |
          sudo apt-get -q -y install desktop-file-utils fonts-dejavu fonts-liberation
          . $INSTALL_PATH/System/Library/Makefiles/GNUstep.sh
          ./Scripts/stamp-version.sh "$APP_VERSION"
          GNUSTEP_PREFIX="$INSTALL_PATH" ./Scripts/prepare-appdir.sh
          GNUSTEP_PREFIX="$INSTALL_PATH" ./Scripts/package-appimage.sh

      # Both apps have to START. They are GUI-only, so each is launched
      # against a virtual display and left for a moment: a bundle that cannot
      # find its framework, the backend or its resources dies immediately,
      # here rather than for whoever downloads it.
      - name: Smoke-test the AppImage
        run: |
          image=$(ls XFormsKit-Linux-*.AppImage)
          chmod +x "$image"
          # "" is the no-argument case: the launcher, which is what
          # opening the image does.
          for app in "" viewer designer; do
            timeout 90 xvfb-run -a ./"$image" $app &
            pid=$!
            sleep 25
            if kill -0 $pid 2>/dev/null; then
              echo "${app:-launcher}: up after 25s"
              kill $pid 2>/dev/null || true
              wait $pid 2>/dev/null || true
            else
              wait $pid; status=$?
              echo "::error::${app:-launcher} exited on its own with status $status"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: XFormsKit-Linux-${{ github.sha }}
          path: ${{ env.SRC_PATH }}/XFormsKit-Linux-*.AppImage
          retention-days: 14
