# XFormsKit's Windows installer: the launcher, the viewer and the designer.
# The installer is gnustep-release-actions' msi (the runtime, WinUXTheme),
# the same as every app's; see its msi.sh for each name.
NAME=XFormsKit
APPS="XFormsLauncher XFormsViewer XFormsDesigner"
# The Start menu's shortcut starts the launcher, which asks which app.
DEFAULT=XFormsLauncher
ICON=Apps/XFormsLauncher/XFormsLauncher.png
SUMMARY="Fill in and design XForms: XFormsViewer and XFormsDesigner"
# No self-test of its own: started bare the launcher is still up 25 seconds
# later, its window shown.
SMOKE_STAYS_UP=25
