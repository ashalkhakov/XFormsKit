# XFormsKit's AppImage: what it carries and starts. The image is gnustep-release-actions'
# appimage (the launcher, the runtime, the fonts), the same as every app's;
# see its appimage.sh for each name.
IMAGE=XFormsKit
NAME=XFormsKit
# One image, two applications, and the launcher that asks which.
APPS="XFormsLauncher XFormsViewer XFormsDesigner"
DEFAULT=XFormsLauncher
#   <image> designer|viewer ...       (or a symlink so named)
ROUTES="designer,xformsdesigner=XFormsDesigner viewer,xformsviewer=XFormsViewer"
# A form dropped on the image is a form to fill in, not a question.
WITH_FILE=XFormsViewer
ENTRIES="Scripts/appimage/xformskit.desktop=Apps/XFormsLauncher/XFormsLauncher.png Scripts/appimage/xformsviewer.desktop=Apps/XFormsViewer/XFormsViewer.png Scripts/appimage/xformsdesigner.desktop=Apps/XFormsDesigner/XFormsDesigner.png"
# On a clean Ubuntu: the launcher, the viewer and the designer each start
# and stay up.
SMOKE_SCRIPT=Scripts/appimage-smoke.sh
